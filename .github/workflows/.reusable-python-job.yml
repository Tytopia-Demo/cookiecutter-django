name: Reusable Python Job

# This is a reusable workflow that can be called from other workflows
# It provides standardized Python setup with optimized runner configuration

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.12'
        type: string
      runner:
        description: 'Runner to use'
        required: false
        default: 'ubuntu-latest'
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        default: 15
        type: number
      working-directory:
        description: 'Working directory for the job'
        required: false
        default: '.'
        type: string
      requirements-file:
        description: 'Path to requirements file'
        required: false
        default: 'requirements.txt'
        type: string
      cache-dependency-path:
        description: 'Path pattern for cache dependency files'
        required: false
        default: ''
        type: string

jobs:
  python-job:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Start job timer
        id: timer
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.cache-dependency-path || inputs.requirements-file }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.requirements-file }}

      - name: Report job execution time
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.timer.outputs.start_time }}))
          echo "Job execution time: ${duration}s"
          echo "execution_time_seconds=${duration}" >> $GITHUB_STEP_SUMMARY
